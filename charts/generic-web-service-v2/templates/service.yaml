apiVersion: v1
kind: Service
metadata:
  name: {{ include "generic-web-service-v2.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "generic-web-service-v2.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "generic-web-service-v2.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
