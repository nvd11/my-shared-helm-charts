replicaCount: 1

image:
  repository: nginx
  tag: stable
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

containerPort: 80
command: []
args: []

env: []
envFrom: []

configMap:
  enabled: false
  name: ""
  data: {}

secret:
  name: ""

volumes: []
volumeMounts: []

resources: {}
securityContext: {}
podSecurityContext: {}
nodeSelector: {}
affinity: {}
tolerations: []

# DNS 解析优化：ndots:2 让带 ≥2 个点的 FQDN 优先按绝对域名解析，绕开 ndots:5 +
# Tailscale 搜索域（tail9619f4.ts.net）导致的跨境域名解析超时 / UnknownHostException。
# 默认留空不启用，需要时在具体 app 的 helm values 里覆盖 dnsConfig。
dnsPolicy: ""
dnsConfig: {}

livenessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /
  port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  annotations: {}

route:
  enabled: false
  parentGateway: kong-main-gateway
  parentGatewayNamespace: default
  path: /
  pathType: PathPrefix

externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: SecretStore
  target:
    name: ""
    creationPolicy: Owner
  data: []
